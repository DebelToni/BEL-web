<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BEL Knowledge Graph</title>
  <style>
    :root {
      --bg: #fbf7ef;
      --panel: rgba(255, 252, 246, 0.88);
      --ink: #1f1a17;
      --muted: #6d625b;
      --line: rgba(63, 53, 46, 0.12);
      --shadow: 0 18px 48px rgba(67, 52, 36, 0.14);
      --font-display: Georgia, "Times New Roman", serif;
      --font-ui: "Avenir Next", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-ui);
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 214, 10, 0.18), transparent 24%),
        radial-gradient(circle at bottom right, rgba(0, 184, 212, 0.16), transparent 22%),
        linear-gradient(160deg, #fdf7ef 0%, #f7f2ea 40%, #f3ede6 100%);
      min-height: 100vh;
    }
    .shell {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 360px;
      gap: 18px;
      padding: 18px;
      min-height: 100vh;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .left, .right { padding: 18px; overflow: auto; }
    .center { padding: 10px; position: relative; overflow: hidden; }
    h1, h2, h3 { font-family: var(--font-display); margin: 0 0 10px; }
    h1 { font-size: 28px; line-height: 1.1; }
    h2 { font-size: 18px; }
    p, li, label, input, select, button { font-size: 14px; line-height: 1.45; }
    .muted { color: var(--muted); }
    .stat { margin: 4px 0; font-size: 13px; color: var(--muted); }
    .controls { display: grid; gap: 14px; margin: 18px 0 22px; }
    .control { display: grid; gap: 8px; }
    input[type="search"], select, input[type="range"] { width: 100%; }
    input[type="search"], select {
      border: 1px solid rgba(63, 53, 46, 0.14);
      background: rgba(255,255,255,0.85);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      color: inherit;
    }
    input[type="range"] { accent-color: #1e88e5; }
    .legend { display: grid; gap: 8px; }
    .legend-item { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; align-items: start; }
    .legend-swatch { width: 14px; height: 14px; border-radius: 999px; margin-top: 3px; }
    .legend-item strong { display: block; font-size: 13px; }
    .legend-item span { display: block; font-size: 12px; color: var(--muted); }
    .canvas-wrap {
      position: absolute;
      inset: 10px;
      border-radius: 18px;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.78), rgba(255,255,255,0.48)),
        linear-gradient(180deg, rgba(255,255,255,0.68), rgba(248,243,235,0.9));
      border: 1px solid var(--line);
      overflow: hidden;
    }
    svg { width: 100%; height: 100%; display: block; }
    .edge { stroke-linecap: round; transition: opacity 0.2s ease; }
    .edge.dimmed { opacity: 0.06 !important; }
    .node-label { font: 12px var(--font-ui); fill: rgba(33, 27, 23, 0.86); pointer-events: none; }
    .motif-label { font: 12px var(--font-ui); fill: rgba(70, 58, 50, 0.72); letter-spacing: 0.03em; }
    .node { cursor: pointer; transition: opacity 0.2s ease; }
    .node.dimmed { opacity: 0.16; }
    .tooltip {
      position: absolute;
      max-width: 360px;
      pointer-events: none;
      background: rgba(35, 28, 24, 0.92);
      color: #fffaf4;
      padding: 10px 12px;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.24);
      font-size: 12px;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.16s ease, transform 0.16s ease;
      z-index: 5;
    }
    .tooltip.visible { opacity: 1; transform: translateY(0); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(63,53,46,0.12);
      font-size: 12px;
    }
    .chip-dot { width: 10px; height: 10px; border-radius: 999px; }
    .connections { display: grid; gap: 8px; margin-top: 16px; }
    .connection {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(63,53,46,0.1);
    }
    .connection strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .connection span { display: block; font-size: 12px; color: var(--muted); }
    .empty { color: var(--muted); font-size: 13px; }
    @media (max-width: 1320px) {
      .shell { grid-template-columns: 280px minmax(0, 1fr); }
      .right { grid-column: 1 / -1; min-height: 320px; }
    }
    @media (max-width: 980px) {
      .shell { grid-template-columns: 1fr; }
      .center { min-height: 72vh; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="panel left">
      <h1>BEL Graph</h1>
      <p class="muted">29 произведения, 406 връзки и 12 главни мотива в една мотивно-анкерирана карта.</p>
      <div class="stat" id="stats-text"></div>
      <div class="controls">
        <div class="control">
          <label for="search">Търсене на произведение</label>
          <input id="search" type="search" placeholder="Напр. Паисий, Ноев ковчег...">
        </div>
        <div class="control">
          <label for="motif-filter">Филтър по мотив</label>
          <select id="motif-filter"></select>

        <div class="control">
          <label for="weight-filter">Минимална сила на връзката: <strong id="weight-value"></strong></label>
          <input id="weight-filter" type="range" min="0" max="1" step="0.01" value="0.28">
        </div>
      </div>
      <h2>Главни мотиви</h2>
      <div id="legend" class="legend"></div>
    </aside>

    <main class="panel center">
      <div class="canvas-wrap">
        <svg id="graph" viewBox="-620 -500 1240 1000" preserveAspectRatio="xMidYMid meet">
          <g id="motif-layer"></g>
          <g id="edge-layer"></g>
          <g id="node-layer"></g>
          <g id="label-layer"></g>
        </svg>
      </div>
      <div id="tooltip" class="tooltip"></div>
    </main>

    <aside class="panel right">
      <h2 id="detail-title">Избери произведение</h2>
      <p id="detail-meta" class="muted">Щракни върху възел, за да видиш описание, мотивен профил и най-силни връзки.</p>
      <div id="detail-description"></div>
      <div id="detail-chips" class="chips"></div>
      <div id="detail-analysis" class="muted"></div>
      <h3 style="margin-top: 18px;">Най-силни връзки</h3>
      <div id="connections" class="connections"><div class="empty">Още няма избран възел.</div></div>
    </aside>
  </div>

е мисия. Чрез него Виктор Пасков утвърждава идеята, че красотата и добротата имат смисъл само ако са създадени с отдаденост и любов. Същевременно творбата разкрива и болката на свят, в който духовното често е подценено, а човекът е под натиска на бедността и всекидневните грижи. Контрастът между цигулката и бюфета е особено важен: единият предмет носи хармония и извисяване, а другият - битовост и тежест. Така \"Балада за Георг Хених\" внушава, че запазването на човечността е труден, но необходим избор.", "dominant_motif": "labor_creativity", "dominant_label": "Труд и творчество", "dominance": 0.3629, "color": "#00b0ff", "x": -25.8, "y": 27.15, "radius": 16.53, "motifs": [{"id": "labor_creativity", "label": "Труд и творчество", "score": 0.3629, "color": "#00b0ff"}, {"id": "hope_community", "label": "Надежда и общност", "score": 0.1853, "color": "#ff4081"}, {"id": "faith_spirituality", "label": "Вяра и духовност", "score": 0.1815, "color": "#aeea00"}, {"id": "identity_conflict", "label": "Личност и вътрешен конфликт", "score": 0.099, "color": "#6200ea"}, {"id": "social_power", "label": "Общество и власт", "score": 0.0761, "color": "#2962ff"}, {"id": "love", "label": "Любов", "score": 0.0558, "color": "#ff1744"}, {"id": "homeland_memory", "label": "Родина и памет", "score": 0.0228, "color": "#ff6d00"}, {"id": "foreign_other", "label": "Чуждото и другият", "score": 0.0165, "color": "#d500f9"}, {"id": "freedom_revolt", "label": "Свобода и бунт", "score": 0.0, "color": "#ffd600"}, {"id": "nature", "label": "Природа", "score": 0.0, "color": "#00c853"}, {"id": "family_kinship", "label": "Семейство и род", "score": 0.0, "color": "#00b8d4"}, {"id": "death_sacrifice", "label": "Смърт и саможертва", "score": 0.0, "color": "#aa00ff"}]}, {"id": 10, "title": "Две души", "author": "Пейо Яворов", "label": "10. Две души", "description": "\"Две души\" е лирическо стихотворение, в което Яворов показва вътрешното разкъсване на човека между две противоположни начала. В основата му стои конфликтът между добро и зло, светло и мрачно, ангелско и демонично. Лирическият говорител е самотен и страдащ, защото не успява да постигне вътрешна хармония. Творбата представя страданието не само като болка, а и като път към самопознание. Така стихотворението се превръща в изповед за трагизма на човешката душа.", "analysis": "В \"Две души\" Яворов изразява една от най-характерните за символизма идеи - че човекът е вътрешно разкъсан и не може лесно да се освободи от противоречията в себе си. Лирическият герой е обзет от болка, съмнение и чувство за безизходица. Образите на светлото и тъмното внушават, че в човешката природа постоянно се сблъскват противоположни сили. Стихотворението е изповед за трудния път към самопознанието. Яворов показва, че страданието е тежко, но и значимо, защото чрез него човек осъзнава своята дълбочина и сложност. Именно затова творбата звучи едновременно лична и общочовешка.", "dominant_motif": "identity_conflict", "dominant_label": "Личност и вътрешен конфликт", "dominance": 0.8093, "color": "#6200ea", "x": -160.14, "y": 57.2, "radius": 24.57, "motifs": [{"id": "identity_conflict", "label": "Личност и вътрешен конфликт", "score": 0.8093, "color": "#6200ea"}, {"id": "freedom_revolt", "label": "Свобода и бунт", "score": 0.069, "color": "#ffd600"}, {"id": "faith_spirituality", "label": "Вяра и духовност", "score": 0.069, "color": "#aeea00"}, {"id": "nature", "label": "Природа", "score": 0.0264, "color": "#00c853"}, {"id": "labor_creativity", "label": "Труд и творчество", "score": 0.0264, "color": "#00b0ff"}, {"id": "love", "label": "Любов", "score": 0.0, "color": "#ff1744"}, {"id": "homeland_memory", "label": "Родина и памет", "score": 0.0, "color": "#ff6d00"}, {"id": "family_kinship", "label": "Семейство и род", "score": 0.0, "color": "#00b8d4"}, {"id": "social_power", "label": "Общество и власт", "score": 0.0, "color": "#2962ff"}, {"id": "death_sacrifice", "label": "Смърт и саможертва", "score": 0.0, "color": "#aa00ff"}, {"id": "foreign_o  тъжно и силно: тя е отказ от илюзиите, но и защита на вътрешната чест на човека и поета.", "dominant_motif": "identity_conflict", "dominant_label": "Личност и вътрешен конфликт", "dominance": 0.3307, "color": "#6200ea", "x": -33.49, "y": 89.1, "radius": 15.95, "motifs": [{"id": "identity_conflict", "label": "Личност и вътрешен конфликт", "score": 0.3307, "color": "#6200ea"}, {"id": "labor_creativity", "label": "Труд и творчество", "score": 0.2624, "color": "#00b0ff"}, {"id": "faith_spirituality", "label": "Вяра и духовност", "score": 0.2531, "color": "#aeea00"}, {"id": "death_sacrifice", "label": "Смърт и саможертва", "score": 0.1056, "color": "#aa00ff"}, {"id": "social_power", "label": "Общество и власт", "score": 0.028, "color": "#2962ff"}, {"id": "freedom_revolt", "label": "Свобода и бунт", "score": 0.0202, "color": "#ffd600"}, {"id": "love", "label": "Любов", "score": 0.0, "color": "#ff1744"}, {"id": "homeland_memory", "label": "Родина и памет", "score": 0.0, "color": "#ff6d00"}, {"id": "nature", "label": "Природа", "score": 0.0, "color": "#00c853"}, {"id": "family_kinship", "label": "Семейство и род", "score": 0.0, "color": "#00b8d4"}, {"id": "foreign_other", "label": "Чуждото и другият", "score": 0.0, "color": "#d500f9"}, {"id": "hope_community", "label": "Надежда и общност", "score": 0.0, "color": "#ff4081"}]}, {"id": 13, "title": "Железният светилник", "author": "Димитър Талев", "label": "13. Железният светилник", "description": "\"Железният светилник\" е исторически роман от тетралогията на Димитър Талев за съдбата на българите в Македония през Възраждането. Действието се развива в Преспа и проследява живота на семейството Глаушеви на фона на обществени, църковни и национални конфликти. В центъра стоят борбата за духовно и национално пробуждане, семейните отношения и личният избор. Романът показва българската общност като носител на памет, вяра и устойчивост. Заглавието насочва към идеята за духовна светлина, която не угасва въпреки историческите изпитания.", "analysis": "\"Железният светилник\" показва как личните съдби са свързани с историческата съдба на общността. Димитър Талев изгражда образ на народ, който страда, но не се предава, а търси духовна сила в семейството, вярата и паметта. Така творбата не е само разказ за миналото, а и роман за ценностите, които съхраняват общността. В училищен план произведението може да се тълкува като роман за израстването на националната идея. Символът на светилника насочва към просветление, духовна светлина и историческа непрекъснатост. Чрез героите и конфликтите Талев внушава, че свободата започва първо като вътрешна сила и осъзнаване.", "dominant_motif": "homeland_memory", "dominant_label": "Родина и памет", "dominance": 0.3162, "color": "#ff6d00", "x": 115.15, "y": -61.64, "radius": 15.69, "motifs": [{"id": "homeland_memory", "label": "Родина и памет", "score": 0.3162, "color": "#ff6d00"}, {"id": "faith_spirituality", "label": "Вяра и духовност", "score": 0.1734, "color": "#aeea00"}, {"id": "freedom_revolt", "label": "Свобода и бунт", "score": 0.1364, "color": "#ffd600"}, {"id": "family_kinship", "label": "Семейство и род", "score": 0.1364, "color": "#00b8d4"}, {"id": "identity_conflict", "label": "Личност и вътрешен конфликт", "score": 0.1201, "color": "#6200ea"}, {"id": "hope_community", "label": "Надежда и общност", "score": 0.0705, "color": "#ff4081"}, {"id": "love", "label": "Любов", "score": 0.0307, "color": "#ff1744"}, {"id": "social_power", "label": "Общество и власт", "score": 0.0163, "color": "#2962ff"}, {"id": "nature", "label": "Природа", "score": 0.0, "color": "#00c853"}, {"id": "labor_creativity", "label": "Труд и творчество", "score": 0.0, "color": "#00b0ff"}, {"id": "death_sacrifice", "label": "Смърт и саможертва", "score": 0.0, "color": "#aa00ff"}, {"id": "foreign_other", "label": "Чуждото и другият", "score": 0.0, "color": "#d500f9"}]}, {"id": 14, "title": "Бай Ганьо журналист", "author": "Алеко Константинов", "label": "14. Бай Ганьо журналист", "description": "\"Бай Ганьо журналист\" е фейлетон от книгата \"Бай Ганьо. Невероятни разкази за един съвременен българин\". В него Алеко Константинов показва героя в ролята на човек, който се намесва в обществения живот с грубост, самоувереност и желание да изглежда значим. Текстът разобличава фалшивия авторитет, безкритичността и липсата на култура. Чрез комични ситуации и характерна реч авторът осмива не само Бай Ганьо, но и средата, която допуска подобно поведение. Произведението поставя въпроси за морала, публичното слово и обществената отговорност.", "analysis": "В този фейлетон Алеко Константинов използва хумор и ирония, за да покаже как Бай Ганьо се опитва да бъде \"журналист\", без да притежава нужната култура, мярка и отговорност. Комичното идва от разминаването между високите му претенции и смешното, често агресивно поведение. Така авторът критикува не само героя, а и явлението на духовната посредственост, която се стреми към обществено влияние. Произведението е и обществено предупреждение. То внушава, че човек не става значим чрез шум, самоувереност и натрапване, а чрез знания, морал и уважение към другите. Затова \"Бай Ганьо журналист\" остава актуален текст за гражданско поведение и критично отношение към публичните фигури.", "dominant_motif": "social_power", "dominant_label": "Общество и власт", "dominance": 0.6701, "color": "#2962ff", "x": -40.35, "y": 175.9, "radius": 22.06, "motifs": [{"id": "social_power", "label": "Общество и власт", "score": 0.6701, "color": "#2962ff"}, {"id": "faith_spirituality", "label": "Вяра и духовност", "score": 0.1615, "color": "#aeea00"}, {"id": "homeland_memory", "label": "Родина и памет", "score": 0.0619, "color": "#ff6d00"}, {"id": "labor_creativity", "label": "Труд и творчество", "score": 0.0619, "color": "#00b0ff"}, {"id": "foreign_other", "label": "Чуждото и другият", "score": 0.0447, "color": "#d500f9"}, {"id": "love", "label": "Любов", "score": 0.0, "color": "#ff1744"}, {"id": "freedom_revolt", "label": "Свобода и бунт", ението поставя в центъра паметта, словото и чувството за историческа принадлежност. Мястото му в българската литература е важно, защото превръща делото на Паисий в емблема на будителството.", "dominant_motif": "homeland_memory", "dominant_label": "Родина и памет", "dominance": 0.5476, "color": "#ff6d00", "x": 154.93, "y": -118.19, "radius": 19.86, "motifs": [{"id": "homeland_memory", "label": "Родина и памет", "score": 0.5476, "color": "#ff6d00"}, {"id": "faith_spirituality", "label": "Вяра и духовност", "score": 0.2019, "color": "#aeea00"}, {"id": "labor_creativity", "label": "Труд и творчество", "score": 0.0696, "color": "#00b0ff"}, {"id": "freedom_revolt", "label": "Свобода и бунт", "score": 0.0603, "color": "#ffd600"}, {"id": "family_kinship", "label": "Семейство и род", "score": 0.0603, "color": "#00b8d4"}, {"id": "love", "label": "Любов", "score": 0.0394, "color": "#ff1744"}, {"id": "identity_conflict", "label": "Личност и вътрешен конфликт", "score": 0.0209, "color": "#6200ea"}, {"id": "nature", "label": "Природа", "score": 0.0, "color": "#00c853"}, {"id": "social_power", "label": "Общество и власт", "score": 0.0, "color": "#2962ff"}, {"id": "death_sacrifice", "label": "Смърт и саможертва", "score": 0.0, "color": "#aa00ff"}, {"id": "foreign_other", "label": "Чуждото и другият", "score": 0.0, "color": "#d500f9"}, {"id": "hope_community", "label": "Надежда и общност", "score": 0.0, "color": "#ff4081"}]}, {"id": 17, "title": "История", "author": "Никола Вапцаров", "label": "17. История", "description": "\"История\" е социално и философско стихотворение на Никола Вапцаров. В него лирическият говорител гледа на историята не като на далечно минало, а като на жив процес, свързан с човешкия труд, страдание и борба. Текстът противопоставя официалната история на живота на обикновения човек. Вапцаров внушава, че истинската история се пише от хората, които работят, страдат и мечтаят за по-добро бъдеще. Произведението е сред важните текстове, чрез които поетът защитава достойнството на човека от труда.", "analysis": "Стихотворението представя историята като процес, създаван от живота на обикновените хора, а не само от царе, войни и дати. Тази гледна точка е типична за Вапцаров, защото той насочва вниманието към работника, бедния и потиснатия човек. Затова текстът звучи едновременно обществено и лично, близко до реалния живот. В \"История\" се усеща вяра, че страданието не е напразно и че от него може да се роди промяна. Поетът не поднася сух урок, а внушава морална позиция: човек трябва да помни миналото, но и да действа за бъдещето. Така творбата е подходяща за училищен анализ на темите за човека, труда, паметта и социалната справедливост.", "dominant_motif": "labor_creativity", "dominant_label": "Труд и творчество", "dominance": 0.2294, "color": "#00b0ff", "x": 22.66, "y": 71.06, "radius": 14.13, "motifs": [{"id": "labor_creativity", "label": "Труд и творчество", "score": 0.2294, "color": "#00b0ff"}, {"id": "social_power", "label": "Общество и власт", "score": 0.2254, "color": "#2962ff"}, {"id": "freedom_revolt", "label": "Свобода и бунт", "score": 0.173, "color": "#ffd600"}, {"id": "homeland_memory", "label": "Родина и памет", "score": 0.0946, "color": "#ff6d00"}, {"id": "faith_spirituality", "label": "Вяра и духовност", "score": 0.0946, "color": "#aeea00"}, {"id": "hope_community", "label": "Надежда и общност", "score": 0.0684, "color": "#ff4081"}, {"id": "identity_conflict", "label": "Личност и вътрешен конфликт", "score": 0.0624, "color": "#6200ea"}, {"id": "family_kinship", "label": "Семейство и род", "score": 0.0262, "color": "#00b8d4"}, {"id": "death_sacrifice", "label": "Смърт и саможертва", "score": 0.0262, "color": "#aa00ff"}, {"id": "love", "label": "Любов", "score": 0.0, "color": "#ff1744"}, {"id": "nature", "label": "Природа", "score": 0.0, "color": "#00c853"}, {"id": "foreign_other", "label": "Чуждото и другият", "score": 0.0, "color": "#d500f9"}]}, {"id": 18, "title": "Ноев ковчег", "author": "Йордан Радичков", "label": "18. Ноев ковчег", "description": "\"Ноев ковчег\" е едно от характерните късни произведения на Йордан Радичков, в което реалното и приказното се преплитат. Книгата използва библейския образ на ковчега като символ на спасение, памет и оцеляване. В нея авторът събира хора, животни, спомени и чудновати случки в един почти митичен свят. Текстът е едновременно земен и философски, с типичния за Радичков хумор, тъга и народна мъдрост. Творбата често се чете като притча за човека в свят на изпитания и промени.", "analysis": "В \"Ноев ковчег\" Радичков не разказва просто история, а създава свят, в който всичко е свързано чрез памет, въображение и страх от загуба. Ковчегът е и убежище, и знак, че хората могат да се спасят само ако останат заедно и не забравят кои са. Произведението е важно с умението на автора да превръща всекидневното в притча. Чрез образи, които са едновременно смешни и тъжни, Радичков показва, че човешкото достойнство се запазва чрез доброта, съчувствие и вярност към живота.", "dominant_motif": "hope_community", "dominant_label": "Надежда и общност", "dominance": 0.3974, "color": "#ff4081", "x": 82.57, "y": -97.67, "radius": 17.15, "motifs": [{"id": "hope_community", "label": "Надежда и общност", "score": 0.3974, "color": "#ff4081"}, {"id": "faith_spirituality", "label": "Вяра и духовност", "score": 0.2666, "color": "#aeea00"}, {"id": "nature", "label": "Природа", "score": 0.1424, "color": "#00c853"}, {"id": "homeland_memory", "label": "Родина и памет", "score": 0.1374, "color": "#ff6d00"}, {"id": "identity_conflict", "label": "Личност и вътрешен конфликт", "score": 0.0563, "color": "#6200ea"}, {"id": "love", "label": "Любов", "score": 0.0, "color": "#ff1744"}, {"id": "freedom_revolt", "label": "Свобода и бунт", "score": 0.0, "color": "#ffd600"}, {"id": "family_kinship", "label": "Семейство и род", "score": 0.0, "color": "#00b8d4"}, {"id": "labor_creativity", "label": "Труд и творчество", "score": 0.0, "color": "#00b0ff"}, {"id": "social_power", "lab ", "score": 0.591, "color": "#2962ff"}, {"id": "hope_community", "label": "Надежда и общност", "score": 0.1219, "color": "#ff4081"}, {"id": "freedom_revolt", "label": "Свобода и бунт", "score": 0.0868, "color": "#ffd600"}, {"id": "nature", "label": "Природа", "score": 0.0785, "color": "#00c853"}, {"id": "identity_conflict", "label": "Личност и вътрешен конфликт", "score": 0.0568, "color": "#6200ea"}, {"id": "faith_spirituality", "label": "Вяра и духовност", "score": 0.0434, "color": "#aeea00"}, {"id": "homeland_memory", "label": "Родина и памет", "score": 0.0217, "color": "#ff6d00"}, {"id": "love", "label": "Любов", "score": 0.0, "color": "#ff1744"}, {"id": "family_kinship", "label": "Семейство и род", "score": 0.0, "color": "#00b8d4"}, {"id": "labor_creativity", "label": "Труд и творчество", "score": 0.0, "color": "#00b0ff"}, {"id": "death_sacrifice", "label": "Смърт и саможертва", "score": 0.0, "color": "#aa00ff"}, {"id": "foreign_other", "label": "Чуждото и другият", "score": 0.0, "color": "#d500f9"}]}, {"id": 21, "title": "Приказка за стълбата", "author": "Христо Смирненски", "label": "21. Приказка за стълбата", "description": "\"Приказка за стълбата\" е сатирична алегория за човек, който се изкачва към властта и постепенно губи морала и съвестта си. Творбата показва как компромисите, направени в името на успеха, водят до духовно падение. Стълбата е символ на общественото издигане, но и на отдалечаването от обикновените хора и истинските човешки ценности. Сюжетът развива идеята за цената на компромиса и за опасността властта да променя човека отвътре. Произведението остава актуално с въпроса дали целта оправдава средствата.", "analysis": "Смирненски използва притчова форма, за да покаже, че моралният избор е по-важен от външния успех. Стълбата не е просто път нагоре, а символ на постепенното отказване от човечността, състраданието и истината. С всяко следващо стъпало героят се отдалечава от своята същност и приема по-удобни, но по-безчестни правила. Творбата зву решния драматизъм на героя между човешката нежност и дълга към народа. Затова стихотворението е едновременно любовно, гражданско и изповедно.", "analysis": "В стихотворението Ботев показва как личното чувство може да бъде подчинено на историческата необходимост. Лирическият герой не отрича любовта, а я преживява като нещо истинско и ценно, но недостатъчно пред лицето на народното страдание. Така творбата превръща любовната изповед в разговор за отговорността към родината. Особено силно е противопоставянето между нежността и борбата, между мечтата за щастие и готовността за жертва. Именно в този сблъсък се разкрива Ботевият герой - свободолюбив, горд и трагичен. Стихотворението въздейства с искреността си и с ясното послание, че свободата е по-висша от личното спокойствие.", "dominant_motif": "freedom_revolt", "dominant_label": "Свобода и бунт", "dominance": 0.2884, "color": "#ffd600", "x": -38.42, "y": -79.77, "radius": 15.19, "motifs": [{"id": "freedom_revolt", "label": "Свобода и бунт", "score": 0.2884, "color": "#ffd600"}, {"id": "love", "label": "Любов", "score": 0.2873, "color": "#ff1744"}, {"id": "identity_conflict", "label": "Личност и вътрешен конфликт", "score": 0.235, "color": "#6200ea"}, {"id": "homeland_memory", "label": "Родина и памет", "score": 0.124, "color": "#ff6d00"}, {"id": "social_power", "label": "Общество и власт", "score": 0.037, "color": "#2962ff"}, {"id": "family_kinship", "label": "Семейство и род", "score": 0.0141, "color": "#00b8d4"}, {"id": "death_sacrifice", "label": "Смърт и саможертва", "score": 0.0141, "color": "#aa00ff"}, {"id": "faith_spirituality", "label": "Вяра и духовност", "score": 0.0, "color": "#aeea00"}, {"id": "nature", "label": "Природа", "score": 0.0, "color": "#00c853"}, {"id": "labor_creativity", "label": "Труд и творчество", "score": 0.0, "color": "#00b0ff"}, {"id": "foreign_other", "label": "Чуждото и другият", "score": 0.0, "color": "#d500f9"}, {"id": "hope_community", "label": "Надежда и общност", "score": 0.0, "c торията. За ученика това стихотворение е урок, че културното наследство е част от националната идентичност.", "dominant_motif": "homeland_memory", "dominant_label": "Родина и памет", "dominance": 0.3642, "color": "#ff6d00", "x": 181.44, "y": -46.95, "radius": 16.56, "motifs": [{"id": "homeland_memory", "label": "Родина и памет", "score": 0.3642, "color": "#ff6d00"}, {"id": "faith_spirituality", "label": "Вяра и духовност", "score": 0.2787, "color": "#aeea00"}, {"id": "nature", "label": "Природа", "score": 0.194, "color": "#00c853"}, {"id": "family_kinship", "label": "Семейство и род", "score": 0.1102, "color": "#00b8d4"}, {"id": "love", "label": "Любов", "score": 0.03, "color": "#ff1744"}, {"id": "freedom_revolt", "label": "Свобода и бунт", "score": 0.0115, "color": "#ffd600"}, {"id": "identity_conflict", "label": "Личност и вътрешен конфликт", "score": 0.0115, "color": "#6200ea"}, {"id": "labor_creativity", "label": "Труд и творчество", "score": 0.0, "color": "#00b0ff"}, {"id": "social_power", "label": "Общество и власт", "score": 0.0, "color": "#2962ff"}, {"id": "death_sacrifice", "label": "Смърт и саможертва", "score": 0.0, "color": "#aa00ff"}, {"id": "foreign_other", "label": "Чуждото и другият", "score": 0.0, "color": "#d500f9"}, {"id": "hope_community", "label": "Надежда и общност", "score": 0.0, "color": "#ff4081"}]}, {"id": 26, "title": "Градушка", "author": "Пейо Яворов", "label": "26. Градушка", "description": "\"Градушка\" е лирическа поема за тежката съдба на българския селянин и за унищожителната сила на природната стихия. Творбата показва година на труд, надежда и очакване, която е погубена от градушката. Яворов съчетава битова картина, социална болка и силен драматизъм. Произведението е изградено като движение от надежда към катастрофа. В него природата не е само фон, а жесток участник в човешката трагедия.", "analysis": "В \"Градушка\" Яворов представя селянина като човек, който живее в непрекъсната борба с природата и със собствената си бедност. Нач ": "Родина и памет", "score": 0.0, "color": "#ff6d00"}, {"id": "freedom_revolt", "label": "Свобода и бунт", "score": 0.0, "color": "#ffd600"}, {"id": "faith_spirituality", "label": "Вяра и духовност", "score": 0.0, "color": "#aeea00"}], "reason": "Връзката между Бай Ганьо журналист и Спи езерото е по-скоро слаба и идва от общ литературен фон, а не от ясно изразен водещ мотив."}, {"source": 7, "target": 27, "source_title": "Ветрената мелница", "target_title": "Спи езерото", "weight": 0.0069, "motif_cosine": 0.0, "text_cosine": 0.0344, "primary_motif": "love", "top_motifs": [{"id": "love", "label": "Любов", "score": 0.0, "color": "#ff1744"}, {"id": "homeland_memory", "label": "Родина и памет", "score": 0.0, "color": "#ff6d00"}, {"id": "freedom_revolt", "label": "Свобода и бунт", "score": 0.0, "color": "#ffd600"}, {"id": "faith_spirituality", "label": "Вяра и духовност", "score": 0.0, "color": "#aeea00"}], "reason": "Връзката между Ветрената мелница и Спи езерото е по-скоро слаба и идва от общ литературен фон, а не от ясно изразен водещ мотив."}, {"source": 2, "target": 7, "source_title": "Колко си хубава", "target_title": "Ветрената мелница", "weight": 0.0058, "motif_cosine": 0.0, "text_cosine": 0.0292, "primary_motif": "love", "top_motifs": [{"id": "love", "label": "Любов", "score": 0.0, "color": "#ff1744"}, {"id": "homeland_memory", "label": "Родина и памет", "score": 0.0, "color": "#ff6d00"}, {"id": "freedom_revolt", "label": "Свобода и бунт", "score": 0.0, "color": "#ffd600"}, {"id": "faith_spirituality", "label": "Вяра и духовност", "score": 0.0, "color": "#aeea00"}], "reason": "Връзката между Колко си хубава и Ветрената мелница е по-скоро слаба и идва от общ литературен фон, а не от ясно изразен водещ мотив."}]}</script>
  <script>
    const graphData = JSON.parse(document.getElementById('graph-data').textContent);
    const motifFilter = document.getElementById('motif-filter');
    const weightFilter = document.getElementById('weight-filter');
    const weightValue = document.getElementById('weight-value');
    const searchInput = document.getElementById('search');
    const statsText = document.getElementById('stats-text');
    const legend = document.getElementById('legend');
    const motifLayer = document.getElementById('motif-layer');
    const edgeLayer = document.getElementById('edge-layer');
    const nodeLayer = document.getElementById('node-layer');
    const labelLayer = document.getElementById('label-layer');
    const tooltip = document.getElementById('tooltip');

    const detailTitle = document.getElementById('detail-title');
    const detailMeta = document.getElementById('detail-meta');
    const detailDescription = document.getElementById('detail-description');
    const detailChips = document.getElementById('detail-chips');
    const detailAnalysis = document.getElementById('detail-analysis');
    const connectionsBox = document.getElementById('connections');

    const works = graphData.works;
    const worksById = new Map(works.map(work => [work.id, work]));
    const edges = graphData.edges;
    const selectedState = { workId: null };

    statsText.textContent = `${graphData.meta.work_count} произведения · ${graphData.meta.edge_count} пълни двойки · мотивно-анкериран force layout`;

    motifFilter.innerHTML = '<option value="all">Всички мотиви</option>' + graphData.motifs.map(motif => `<option value="${motif.id}">${motif.label}</option>`).join('');
    weightValue.textContent = Number(weightFilter.value).toFixed(2);

    legend.innerHTML = graphData.motifs.map(motif => `
      <div class="legend-item">
        <div class="legend-swatch" style="background:${motif.color}"></div>
        <div>
          <strong>${motif.label}</strong>
          <span>${motif.description}</span>
        </div>
      </div>
    `).join('');

    motifLayer.innerHTML = graphData.motifs.map(motif => `
      <g>
        <circle cx="${motif.anchor.x}" cy="${motif.anchor.y}" r="6" fill="${motif.color}" fill-opacity="0.25"></circle>
        <text class="motif-label" x="${motif.anchor.x}" y="${motif.anchor.y - 14}" text-anchor="middle">${motif.label}</text>
      </g>
    `).join('');

    const edgeElements = edges.map(edge => {
      const primary = graphData.motifs.find(motif => motif.id === edge.primary_motif);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('class', 'edge');
      line.dataset.source = edge.source;
      line.dataset.target = edge.target;
      line.dataset.primaryMotif = edge.primary_motif;
      line.dataset.weight = edge.weight;
      line.setAttribute('stroke', primary.color);
      line.setAttribute('stroke-opacity', String(0.08 + edge.weight * 0.66));
      line.setAttribute('stroke-width', String(0.8 + edge.weight * 6.5));
      const source = worksById.get(edge.source);
      const target = worksById.get(edge.target);
      line.setAttribute('x1', source.x);
      line.setAttribute('y1', source.y);
      line.setAttribute('x2', target.x);
      line.setAttribute('y2', target.y);
      line.addEventListener('mousemove', event => showTooltip(event, `<strong>${source.title}</strong> ↔ <strong>${target.title}</strong><br>${edge.reason}`));
      line.addEventListener('mouseleave', hideTooltip);
      edgeLayer.appendChild(line);
      return { edge, element: line };
    });

    const nodeElements = works.map(work => {
      const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      group.setAttribute('class', 'node');
      group.dataset.id = work.id;

      const halo = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      halo.setAttribute('cx', work.x);
      halo.setAttribute('cy', work.y);
      halo.setAttribute('r', work.radius + 6);
      halo.setAttribute('fill', work.color);
      halo.setAttribute('fill-opacity', '0.12');
      group.appendChild(halo);

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', work.x);
      circle.setAttribute('cy', work.y);
      circle.setAttribute('r', work.radius);
      circle.setAttribute('fill', work.color);
      circle.setAttribute('stroke', 'rgba(38, 29, 23, 0.55)');
      circle.setAttribute('stroke-width', '1.4');
      group.appendChild(circle);

      group.addEventListener('mousemove', event => showTooltip(event, `<strong>${work.title}</strong><br>${work.author}<br>Доминиращ мотив: ${work.dominant_label}`));
      group.addEventListener('mouseleave', hideTooltip);
      group.addEventListener('click', () => selectWork(work.id));
      nodeLayer.appendChild(group);

      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('class', 'node-label');
      label.setAttribute('x', work.x);
      label.setAttribute('y', work.y + work.radius + 16);
      label.setAttribute('text-anchor', 'middle');
      label.textContent = work.title;
      labelLayer.appendChild(label);

      return { work, group, circle, label };
    });

    function formatMotifScore(score) {
      return `${(score * 100).toFixed(1)}%`;
    }

    function selectWork(workId) {
      selectedState.workId = workId;
      const work = worksById.get(workId);
      if (!work) return;

      detailTitle.textContent = `${String(work.id).padStart(2, '0')}. ${work.title}`;
      detailMeta.textContent = `${work.author} · Доминиращ мотив: ${work.dominant_label} · Интензитет: ${formatMotifScore(work.dominance)}`;
      detailDescription.innerHTML = `<p>${work.description}</p>`;
      detailChips.innerHTML = work.motifs.slice(0, 6).map(motif => `
        <div class="chip">
          <span class="chip-dot" style="background:${motif.color}"></span>
          <span>${motif.label} · ${formatMotifScore(motif.score)}</span>
        </div>
      `).join('');
      detailAnalysis.innerHTML = `<p>${work.analysis}</p>`;

      const related = edges
        .filter(edge => edge.source === workId || edge.target === workId)
        .sort((a, b) => b.weight - a.weight)
        .slice(0, 8);

      if (!related.length) {
        connectionsBox.innerHTML = '<div class="empty">Няма достатъчно данни за връзки.</div>';
      } else {
        connectionsBox.innerHTML = related.map(edge => {
          const otherId = edge.source === workId ? edge.target : edge.source;
          const other = worksById.get(otherId);
          return `
            <div class="connection">
              <strong>${other.title}</strong>
              <span>Сила: ${edge.weight.toFixed(2)} · Водещ мотив: ${edge.top_motifs[0].label}</span>
              <span>${edge.reason}</span>
            </div>
          `;
        }).join('');
      }

      nodeElements.forEach(item => {
        item.circle.setAttribute('stroke-width', item.work.id === workId ? '3.6' : '1.4');
        item.circle.setAttribute('stroke', item.work.id === workId ? '#111' : 'rgba(38, 29, 23, 0.55)');
      });
    }

    function showTooltip(event, content) {
      tooltip.innerHTML = content;
      tooltip.classList.add('visible');
      const bounds = tooltip.parentElement.getBoundingClientRect();
      tooltip.style.left = `${event.clientX - bounds.left + 16}px`;
      tooltip.style.top = `${event.clientY - bounds.top + 16}px`;
    }

    function hideTooltip() {
      tooltip.classList.remove('visible');
    }

    function updateGraph() {
      const search = searchInput.value.trim().toLowerCase();
      const motifId = motifFilter.value;
      const minWeight = Number(weightFilter.value);
      weightValue.textContent = minWeight.toFixed(2);

      const visibleWorks = new Set();
      works.forEach(work => {
        const searchOk = !search || work.title.toLowerCase().includes(search) || work.author.toLowerCase().includes(search);
        const motifOk = motifId === 'all' || work.motifs.some(motif => motif.id === motifId && motif.score >= 0.14);
        if (searchOk && motifOk) visibleWorks.add(work.id);
      });

      edgeElements.forEach(({ edge, element }) => {
        const edgeMotifOk = motifId === 'all' || edge.top_motifs.some(motif => motif.id === motifId && motif.score >= 0.03);
        const visible = edge.weight >= minWeight && edgeMotifOk && visibleWorks.has(edge.source) && visibleWorks.has(edge.target);
        element.style.display = visible ? 'block' : 'none';
        element.classList.toggle('dimmed', selectedState.workId && !(edge.source === selectedState.workId || edge.target === selectedState.workId));
      });

      nodeElements.forEach(({ work, group, label }) => {
        const visible = visibleWorks.has(work.id);
        group.style.display = visible ? 'block' : 'none';
        label.style.display = visible ? 'block' : 'none';
        const dimmed = selectedState.workId && selectedState.workId !== work.id;
        group.classList.toggle('dimmed', dimmed);
        label.style.opacity = dimmed ? '0.25' : '0.92';
      });
    }

    motifFilter.addEventListener('change', updateGraph);
    weightFilter.addEventListener('input', updateGraph);
    searchInput.addEventListener('input', updateGraph);

    selectWork(1);
    updateGraph();
  </script>
</body>
</html>
